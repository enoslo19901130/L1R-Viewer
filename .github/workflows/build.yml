name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Release
        run: dotnet build L1R-Viewer.slnx -c Release --nologo
      - name: Unit tests
        run: dotnet test tests/L1R.Shared.Tests/L1R.Shared.Tests.csproj -c Release --nologo --no-build
      - name: Doctor fixture regression
        shell: pwsh
        run: |
          $cli = "src/L1R.Cli/bin/Release/net10.0/pakviewer-cli.exe"
          $bad = Join-Path $env:TEMP "ci-bad"
          New-Item -ItemType Directory -Force -Path $bad | Out-Null
          & $cli doctor $bad; if ($LASTEXITCODE -eq 0) { throw "doctor should fail" }
          $good = Join-Path $env:TEMP "ci-good"
          New-Item -ItemType Directory -Force -Path "$good/map/1" | Out-Null
          [IO.File]::WriteAllBytes("$good/Tile.idx", [byte[]](0))
          Set-Content "$good/map/1/a.s32" "x"
          $j = & $cli doctor $good --json | Out-String
          if ($j -notmatch '"ok"\s*:\s*true') { throw "doctor should pass fixture: $j" }

  mcp-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check MCP
        run: |
          python -m py_compile mcp/server.py
          python -m py_compile mcp/smoke_test.py
